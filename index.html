<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>신한DS 협력사 도급 공정 관제 시스템 (S-GUARD)</title>
    
    <!-- PWA Web App Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- iOS Apple Web App Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="S-GUARD" />

    <!-- Android / Chrome / Windows PWA Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0052FF" />
    <meta name="application-name" content="S-GUARD" />
    <meta name="description" content="신한DS 및 협력사 도급 공정 근태 및 투입인력 안전 관제 시스템" />

    <!-- Pretendard Variable Font CDN -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Kakao Maps SDK CDN (비동기 안전 로드) -->
    <script>
      (function() {
        try {
          var script = document.createElement('script');
          script.type = 'text/javascript';
          script.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=6fdbed77a229d105034026990013707b&autoload=false&libraries=services,clusterer';
          script.async = true;
          script.onerror = function() {
            console.warn('[KakaoMap] SDK load skipped (Domain not registered in Kakao Console). Falling back to Leaflet & Radar GPS map.');
          };
          document.head.appendChild(script);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[S-GUARD PWA] Service Worker registered successfully with scope:', reg.scope);
            })
            .catch((err) => {
              console.warn('[S-GUARD PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
